# Reference config – must be added manually via `oc edit network.operator.openshift.io cluster`
spec:
  additionalNetworks:
  - name: dhcp-shim
    namespace: openstack
    type: Raw
    rawCNIConfig: |
      {
        "cniVersion": "0.3.1",
        "name": "dhcp-shim",
        "type": "bridge",
        "ipam": {
          "type": "dhcp"
        }
      }
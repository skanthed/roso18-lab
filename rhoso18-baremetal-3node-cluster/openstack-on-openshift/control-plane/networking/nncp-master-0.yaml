apiVersion: nmstate.io/v1
kind: NodeNetworkConfigurationPolicy
metadata:
  name: nncp-master-0
spec:
  nodeSelector:
    kubernetes.io/hostname: master-0
    node-role.kubernetes.io/worker: ""

  desiredState:
    interfaces:
      - name: eno2
        description: RHOSO ctlplane and VLAN trunk
        type: ethernet
        state: up
        mtu: 1500
        ipv4:
          enabled: true
          dhcp: false
          address:
            - ip: 192.168.122.10
              prefix-length: 24
        ipv6:
          enabled: false

      - name: internalapi
        description: Internal API VLAN 20
        type: vlan
        state: up
        mtu: 1500
        vlan:
          base-iface: eno2
          id: 20
          reorder-headers: true
        ipv4:
          enabled: true
          dhcp: false
          address:
            - ip: 172.17.0.10
              prefix-length: 24
        ipv6:
          enabled: false

      - name: tenant
        description: Tenant VLAN 22
        type: vlan
        state: up
        mtu: 1500
        vlan:
          base-iface: eno2
          id: 22
          reorder-headers: true
        ipv4:
          enabled: true
          dhcp: false
          address:
            - ip: 172.19.0.10
              prefix-length: 24
        ipv6:
          enabled: false

      - name: eno2.83
        description: VLAN 83 parent for Ironic bridge
        type: vlan
        state: up
        mtu: 1500
        vlan:
          base-iface: eno2
          id: 83
          reorder-headers: true
        ipv4:
          enabled: false
        ipv6:
          enabled: false

      - name: ironic
        description: Ironic provisioning Linux bridge
        type: linux-bridge
        state: up
        mtu: 1500
        bridge:
          options:
            stp:
              enabled: false
          port:
            - name: eno2.83
        ipv4:
          enabled: true
          dhcp: false
          address:
            - ip: 172.20.1.16
              prefix-length: 24
        ipv6:
          enabled: false

      - name: ironicvrf
        description: VRF for Ironic provisioning traffic
        type: vrf
        state: up
        vrf:
          route-table-id: 10
          port:
            - ironic

---
apiVersion: core.openstack.org/v1beta1
kind: OpenStackControlPlane
metadata:
  name: openstack-control-plane
  namespace: openstack
spec:
  secret: osp-secret
  storageClass: lvms-local-storage-osac

# DNS service
  dns:
    template:
      replicas: 1
      options:
        - key: server
          values:
            - 192.168.122.1
    override:
        service:
          metadata:
            annotations:
              metallb.universe.tf/address-pool: ctlplane
              metallb.universe.tf/allow-shared-ip: ctlplane
              metallb.universe.tf/loadBalancerIPs: 192.168.122.80
          spec:
            type: LoadBalancer
  
  # Identity service (keystone)
  keystone:
    apiOverride:
      route: {}
    template:
      databaseInstance: openstack
      secret: osp-secret
      replicas: 1
      override:
        service:
          internal:
            metadata:
              annotations:
                metallb.universe.tf/address-pool: internalapi
                metallb.universe.tf/allow-shared-ip: internalapi
                metallb.universe.tf/loadBalancerIPs: 172.17.0.80
            spec:
              type: LoadBalancer


  # Image service (glance)
  glance:
    enabled: false
    apiOverrides:
      default:
        route: {}
    template:
      databaseInstance: openstack
      storage:
        storageRequest: 10G
        storageClass: lvms-local-storage-osac
      secret: osp-secret
      keystoneEndpoint: default
      glanceAPIs:
        default:
          replicas: 0
          layout: single
          override:
            service:
              internal:
                metadata:
                  annotations:
                    metallb.universe.tf/address-pool: internalapi
                    metallb.universe.tf/allow-shared-ip: internalapi
                    metallb.universe.tf/loadBalancerIPs: 172.17.0.80
                spec:
                  type: LoadBalancer
          networkAttachments: []
  
  # Networking service (neutron)
  neutron:
    apiOverride:
      route: {}
    template:
      replicas: 1
      customServiceConfig: |       
        [agent]
        report_interval = 300

        [ml2_type_vlan]
        network_vlan_ranges = bmnet:50:100

        [ml2]
        type_drivers = geneve,vxlan,vlan,flat,local
        tenant_network_types = vlan,flat
      databaseInstance: openstack
      extraMounts:
      - name: switchConf
        extraVol:
        - volumes:
          - name: neutron-switch-config
            secret:
              secretName: neutron-switch-config
          mounts:
          - name: neutron-switch-config
            mountPath: /etc/neutron/neutron.conf.d/03-ml2-genericswitch.conf
            subPath: 03-ml2-genericswitch.conf
            readOnly: true
      ml2MechanismDrivers:
      - ovn
      - genericswitch
      - baremetal
      secret: osp-secret
      override:
        service:
          internal:
            metadata:
              annotations:
                metallb.universe.tf/address-pool: internalapi
                metallb.universe.tf/allow-shared-ip: internalapi
                metallb.universe.tf/loadBalancerIPs: 172.17.0.80
            spec:
              type: LoadBalancer
      networkAttachments:
        - internalapi


  # OVN backend
  ovn:
    template:
      ovnController:
        networkAttachment: tenant
        nicMappings:
          bmnet: ospbr
      ovnDBCluster:
        ovndbcluster-nb:
          replicas: 1
          dbType: NB
          storageRequest: 10G
          networkAttachment: internalapi
        ovndbcluster-sb:
          replicas: 1
          dbType: SB
          storageRequest: 10G
          networkAttachment: internalapi
      ovnNorthd: {}

  # Memcached cluster
  memcached:
    templates:
      memcached:
        replicas: 1
  

  # MariaDB Galera clusters (control plane)
  galera:
    templates:
      openstack:
        storageRequest: 5000M
        secret: osp-secret
        replicas: 1

  # RabbitMQ clusters (control plane)
  rabbitmq:
    templates:
      rabbitmq:
        replicas: 1
        override:
          service:
            metadata:
              annotations:
                metallb.universe.tf/address-pool: internalapi
                metallb.universe.tf/loadBalancerIPs: 172.17.0.85
            spec:
              type: LoadBalancer

  # Bare metal provisioning (Ironic)
  ironic:
    enabled: true
    template:
      rpcTransport: oslo
      databaseInstance: openstack
      secret: osp-secret
      ironicAPI:
        replicas: 1
        customServiceConfig: |  
          [DEFAULT]
          default_network_interface = neutron

          [neutron]
          cleaning_network = <ironic_network_uuid>
          provisioning_network = <ironic_network_uuid>
          inspection_network = <ironic_network_uuid>
          rescuing_network = <ironic_network_uuid>
        override:
          service:
            internal:
              metadata:
                annotations:
                  metallb.universe.tf/address-pool: ironic
                  metallb.universe.tf/allow-shared-ip: ironic
                  metallb.universe.tf/loadBalancerIPs: 172.20.1.80
              spec:
                type: LoadBalancer
      ironicConductors:
        - replicas: 1
          customServiceConfig: |  
            [DEFAULT]
            default_network_interface = neutron

            [neutron]
            cleaning_network = <ironic_network_uuid>
            provisioning_network = <ironic_network_uuid>
            inspection_network = <ironic_network_uuid>
            rescuing_network = <ironic_network_uuid>
          storageRequest: 10G
          networkAttachments:
            - ironic
          provisionNetwork: ironic
      ironicInspector:
        replicas: 0
        networkAttachments:
          - ironic
        inspectionNetwork: ironic
      ironicNeutronAgent:
        replicas: 1

cinder:
  enabled: false
nova:
  enabled: false
barbican:
  enabled: false
swift:
  enabled: false
placement:
  enabled: false
telemetry:
  enabled: false
heat:
  enabled: false
designate:
  enabled: false
manila:
  enabled: false
